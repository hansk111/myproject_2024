upstream frontend {
    server frontend:3000;
}

upstream backend {
    server backend:8000;
}


server {
    listen 80;
    server_name smarthan.site;
    client_max_body_size 0;

    location / {
        return 301 https://$host$request_uri;
    }

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

}

server {
    listen 443 ssl;
    server_name smarthan.site;
    client_max_body_size 0;

    location / {
        proxy_pass http://frontend;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Host $host;
        proxy_redirect off;
    }

    location /api/ {
        proxy_pass http://backend;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Host $host;
        proxy_redirect off;
    }

    location /admin/ {
        proxy_pass http://backend/admin/;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Host $host;
        proxy_redirect off;       
    }

    location /static/ {
        proxy_pass http://backend/static/;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Host $host;
        proxy_redirect off;       
    }


    # location /media/ {
    #     proxy_pass http://backend/media/;
    #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    #     proxy_set_header Host $host;
    #     proxy_redirect off;
    #     proxy_set_header Range $http_range;
    #     proxy_set_header If-Range $http_if_range;
    #     add_header Accept-Ranges bytes;           
    # }

    location /media/ {
        proxy_pass http://backend/;  # 경로 끝에 / 제거하여 중복 방지
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_redirect off;

        # CORS 헤더 추가
        add_header 'Access-Control-Allow-Origin' '*' always;
        add_header 'Access-Control-Expose-Headers' 'Origin, Range, Content-Range' always;

        # OPTIONS 요청 처리 (Preflight)
        if ($request_method = 'OPTIONS') {
            add_header 'Access-Control-Allow-Origin' '*';
            add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS';
            add_header 'Access-Control-Allow-Headers' 'Origin, Content-Type, Accept, Range';
            add_header 'Access-Control-Max-Age' 1728000;
            add_header 'Content-Length' 0;
            add_header 'Content-Type' 'text/plain; charset=UTF-8';
            return 204;
        }

        # Range 요청을 위한 설정
        proxy_http_version 1.1;
        proxy_set_header Range $http_range;
        proxy_set_header If-Range $http_if_range;
        proxy_pass_header Content-Range;
        proxy_pass_header Accept-Ranges;
        add_header Accept-Ranges bytes;
    }



    
    ssl_certificate /etc/letsencrypt/live/smarthan.site/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/smarthan.site/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}






