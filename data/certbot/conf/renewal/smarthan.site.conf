# renew_before_expiry = 30 days
version = 1.23.0
archive_dir = /etc/letsencrypt/archive/smarthan.site
cert = /etc/letsencrypt/live/smarthan.site/cert.pem
privkey = /etc/letsencrypt/live/smarthan.site/privkey.pem
chain = /etc/letsencrypt/live/smarthan.site/chain.pem
fullchain = /etc/letsencrypt/live/smarthan.site/fullchain.pem

# Options used in the renewal process
[renewalparams]
account = 8e1dac37bf1207c67ba634d7a2fdbb67
rsa_key_size = 4096
authenticator = webroot
webroot_path = /var/www/certbot,
server = https://acme-v02.api.letsencrypt.org/directory
[[webroot_map]]
smarthan.site = /var/www/certbot
